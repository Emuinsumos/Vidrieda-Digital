function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  function agregarDetalleAlCarrito() {
    const p = productoDetalle;
    if (!p || config.abierto === false) return;
    const extras = (p.opciones || []).filter(o => opcionesSel.includes(o.nombre));
    const extraTotal = extras.reduce((a, o) => a + (Number(o.precioExtra) || 0), 0);
    const precioFinal = p.precio + extraTotal;
    const partes = [];
    if (saborSel) partes.push(saborSel);
    partes.push(...extras.map(o => o.nombre));
    const nombreFinal = partes.length ? `${p.nombre} (${partes.join(', ')})` : p.nombre;
    const cartId = p.id + (partes.length ? '__' + partes.join('|') : '');
    const cant = cantidadDetalle;
    const idAEditar = editandoCartId;
    setCarrito(prev => {
      const base = idAEditar ? prev.filter(it => it.id !== idAEditar) : prev;
      const existe = base.find(it => it.id === cartId);
      if (existe) return base.map(it => it.id === cartId ? { ...it, cantidad: it.cantidad + cant } : it);
      return [...base, { id: cartId, nombre: nombreFinal, precio: precioFinal, cantidad: cant, imagen: p.imagen || '', productoId: p.id, opciones: opcionesSel, sabor: saborSel }];
    });
    cerrarDetalle();
  }

  function puedeEnviarPedido() {
    if (config.abierto === false) return false;
    if (carrito.length === 0) return false;

  const [metodoPagoSel, setMetodoPagoSel] = useState(null); // null | 'efectivo' | 'transferencia'
  const [montoEfectivo, setMontoEfectivo] = useState('');

  function confirmarMetodoPago(metodo) {
    if (!puedeEnviarPedido() || !config.whatsapp) return;
    if (metodo === 'transferencia' && !config.alias) return;
    setMetodoPagoSel(metodo);
  }

  const [errorEnvioPedido, setErrorEnvioPedido] = useState('');
  const [ultimoLinkWsp, setUltimoLinkWsp] = useState('');

  function enviarPedido(ventanaWsp) {
    const metodo = metodoPagoSel;
    if (!puedeEnviarPedido() || !metodo || !config.whatsapp) { if (ventanaWsp) ventanaWsp.close(); return; }
    setEnviandoPedido(true);
    setErrorEnvioPedido('');

    const avisoTimeout = setTimeout(() => {
      setEnviandoPedido(false);
      setErrorEnvioPedido('Se está demorando más de lo normal. Revisá tu conexión a internet y volvé a intentar.');
    }, 15000);

    function manejarError() {
      clearTimeout(avisoTimeout);
      setEnviandoPedido(false);
      setErrorEnvioPedido('No se pudo enviar el pedido. Revisá tu conexión y tocá "Enviar Pedido" de nuevo.');
      if (ventanaWsp && !ventanaWsp.closed) ventanaWsp.close();
    }

    ref('contadorPedidos').transaction(actual => (actual || 0) + 1).then(res => {
      const numero = res.snapshot.val();
      const pedidoData = {
        numero,
        modo: modoConsumo,
        nombre: pedidoForm.nombre || null,
        telefono: pedidoForm.telefono || null,
        direccion: pedidoForm.direccion || null,
        aclaraciones: pedidoForm.aclaraciones || null,
        items: carrito,
        total: totalCarrito,
        pago: { metodo, monto: metodo === 'efectivo' ? (montoEfectivo || null) : null },
        estado: 'recibido',
        mensaje: '',
        creado: Date.now()
      };

      ref('pedidos').push().set(pedidoData).then(() => {
        clearTimeout(avisoTimeout);
        try {
          localStorage.setItem('waystyCliente', JSON.stringify({ nombre: pedidoForm.nombre, telefono: pedidoForm.telefono, direccion: pedidoForm.direccion }));
        } catch (e) {}
        const lineas = [];
        lineas.push(`Pedido #${numero} - ${NOMBRE_NEGOCIO}`);
        if (modoConsumo === 'takeaway') lineas.push(`Modo: Take away - ${pedidoForm.nombre}`);
        if (modoConsumo === 'delivery') {
          lineas.push(`Modo: Delivery`);
          lineas.push(`Cliente: ${pedidoForm.nombre}`);
          lineas.push(`Teléfono: ${pedidoForm.telefono}`);
          lineas.push(`Dirección: ${pedidoForm.direccion}`);
        }
        lineas.push('-------------------------');
        carrito.forEach(it => lineas.push(`${it.cantidad}x ${it.nombre} - $${it.cantidad * it.precio}`));
        lineas.push('-------------------------');
        lineas.push(`Total: $${totalCarrito}`);
        if (metodo === 'efectivo') lineas.push(`Pago: Efectivo - abona con $${montoEfectivo || totalCarrito}`);
        if (metodo === 'transferencia') lineas.push(`Pago: Transferencia - envío el comprobante`);
        if (pedidoForm.aclaraciones) lineas.push(`Aclaraciones: ${pedidoForm.aclaraciones}`);
        const mensajeWsp = encodeURIComponent(lineas.join('\n'));
        const linkWsp = `https://wa.me/${config.whatsapp}?text=${mensajeWsp}`;
        setUltimoLinkWsp(linkWsp);
        if (ventanaWsp && !ventanaWsp.closed) {
          ventanaWsp.location.href = linkWsp;
        } else {
          window.open(linkWsp, '_blank');
        }
        setConfirmacionPedido(`¡Pedido #${numero} enviado! Guardá este número para seguir el estado en "Seguí tu pedido".${config.tiempoEstimado ? ` Tiempo estimado: ${config.tiempoEstimado}.` : ''}`);
        setCarrito([]);
        setPedidoForm(f => ({ ...f, aclaraciones: '' }));
        setMetodoPagoSel(null);
        setMontoEfectivo('');
        setMostrarCarrito(false);
        setEnviandoPedido(false);
      }).catch(manejarError);
    }).catch(manejarError);
  }

  function horaCorta(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }
  function etiquetaOrigenPedido(p) {
    if (p.modo === 'takeaway') return `Take away - ${p.nombre}`;
    return `Delivery - ${p.nombre}`;
  }
  function etiquetaEstadoPedido(estado, modo) {
    if (estado === 'recibido') return 'Recibido';
    if (estado === 'en_preparacion') return 'En preparación';
    if (estado === 'en_camino') return modo === 'delivery' ? 'En camino' : 'Listo para retirar';
    if (estado === 'entregado') return 'Entregado';
    if (estado === 'cobrado') return 'Cobrado';
    if (estado === 'cancelado') return 'Pedido cancelado';
    return estado;
  }
  function buscarPedido() {
    const encontrado = listaPedidos.find(p => String(p.numero) === String(numeroConsulta).trim());
    setPedidoConsultado(encontrado || 'notfound');
  }
  function guardarMensajeCocina(id, texto) {
    ref('pedidos/' + id + '/mensaje').set(texto || '');
  }

  const listaCombos = Object.entries(combos).map(([id, c]) => ({ id, ...c }));
  function resetComboForm() {
    setComboForm({ nombre: '', descripcion: '', precio: '', imagen: '' });
    setEditandoComboId(null);
  }
  function editarCombo(c) {
    setComboForm({ nombre: c.nombre, descripcion: c.descripcion || '', precio: String(c.precio), imagen: c.imagen || '' });
    setEditandoComboId(c.id);
  }
  function guardarCombo() {
    if (!comboForm.nombre || !comboForm.precio) return;
    const id = editandoComboId || ref('combos').push().key;
    ref('combos/' + id).set({
      nombre: comboForm.nombre,
      descripcion: comboForm.descripcion || '',
      precio: Number(comboForm.precio),
      imagen: comboForm.imagen || ''
    });
    resetComboForm();
  }
  function eliminarCombo(id) {
    if (confirm('¿Eliminar este combo/promo?')) ref('combos/' + id).remove();
  }
  function handleImagenCombo(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => setComboForm(f => ({ ...f, imagen: dataUrl })));
    e.target.value = '';
  }

  const listaPreguntasBot = Object.entries(chatbotConfig.preguntas || {}).map(([id, p]) => ({ id, ...p }));
  const SALUDO_BOT_DEFAULT = '¡Hola! 👋 Soy el asistente de Waysty. Elegí una pregunta:';

  function guardarSaludoBot() {
    ref('chatbot/saludo').set(chatSaludoInput);
  }
  function resetPreguntaBotForm() {
    setPreguntaForm({ pregunta: '', respuesta: '' });
    setEditandoPreguntaId(null);
  }
  function editarPreguntaBot(p) {
    setPreguntaForm({ pregunta: p.pregunta, respuesta: p.respuesta });
    setEditandoPreguntaId(p.id);
  }
  function guardarPreguntaBot() {
    if (!preguntaForm.pregunta || !preguntaForm.respuesta) return;
    const id = editandoPreguntaId || ref('chatbot/preguntas').push().key;
    ref('chatbot/preguntas/' + id).set({ pregunta: preguntaForm.pregunta, respuesta: preguntaForm.respuesta });
    resetPreguntaBotForm();
  }
  function eliminarPreguntaBot(id) {
    if (confirm('¿Eliminar esta pregunta del chatbot?')) ref('chatbot/preguntas/' + id).remove();
  }
  function abrirChat() {
    setPreguntaActiva(null);
    setMostrarChat(true);
  }

  function guardarConfig() {
    ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput, tiempoEstimado: tiempoEstimadoInput });
  }
  function toggleLocalAbierto() {
    ref('config/abierto').set(!(config.abierto !== false));
  }
  function handleLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => {
      ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput, tiempoEstimado: tiempoEstimadoInput, logo: dataUrl });
    }, 300);
  }
  // ===================== VISTA COCINA (pantalla completa, sin login) =====================
  if (modoVistaCocina) {
    const pedidosCocina = listaPedidos
      .filter(p => p.estado === 'recibido' || p.estado === 'en_preparacion' || p.estado === 'en_camino')
      .sort((a, b) => (a.creado || 0) - (b.creado || 0));

    const BOTON_SIGUIENTE = {
      recibido: { label: 'Marcar en preparación', clase: 'bg-sky-500 text-white' },
      en_preparacion: (modo) => ({ label: modo === 'delivery' ? 'Marcar en camino' : 'Marcar listo para retirar', clase: 'bg-bronce-500 text-cafe-900' }),
      en_camino: { label: 'Marcar entregado', clase: 'bg-green-600 text-white' },
    };

    return (
      <div className="min-h-screen bg-cafe-900 text-cafe-50 p-4 sm:p-6">
        <div className="flex items-center justify-between mb-5">
          <h1 className="font-heading text-2xl sm:text-3xl font-bold text-bronce-400"><i className="fa-solid fa-kitchen-set mr-2"></i>Cocina</h1>
          <span className="bg-bronce-500 text-cafe-900 text-xs font-bold px-3 py-1.5 rounded-full">{pedidosCocina.length} pendiente{pedidosCocina.length === 1 ? '' : 's'}</span>
        </div>

        {pedidosCocina.length === 0 && (
          <div className="text-center py-24 text-cafe-500">
            <i className="fa-solid fa-burger text-5xl mb-4"></i>
            <p className="text-lg">No hay pedidos pendientes.</p>
          </div>
        )}

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {pedidosCocina.map(p => {
            const boton = p.estado === 'en_preparacion' ? BOTON_SIGUIENTE.en_preparacion(p.modo) : BOTON_SIGUIENTE[p.estado];
            return (
              <div key={p.id} className="bg-cafe-800 border border-cafe-700 rounded-2xl p-4">
                <div className="flex justify-between items-start mb-2">
                  <h2 className="font-heading text-xl font-bold text-bronce-300">Pedido #{p.numero} · {etiquetaOrigenPedido(p)}</h2>
                  <span className="text-cafe-400 text-sm">{horaCorta(p.creado)}</span>
                </div>
                <div className="space-y-1 mb-4 text-lg">
                  {(p.items || []).map((it, idx) => (
                    <p key={idx}>{it.cantidad}x {it.nombre}</p>
                  ))}
                </div>
                {p.aclaraciones && (
                  <p className="text-sm bg-bronce-500/10 border border-bronce-400/30 rounded-lg p-2.5 mb-3"><i className="fa-solid fa-circle-info mr-1.5 text-bronce-500"></i>{p.aclaraciones}</p>
                )}
                <button
                  onClick={() => avanzarEstadoPedido(p.id, p.estado)}
                  className={`w-full py-3 rounded-xl text-base font-bold mb-2 ${boton.clase}`}>
                  {boton.label}
                </button>
                <button
                  onClick={() => cancelarPedido(p.id)}
                  className="w-full py-2 rounded-xl text-sm font-bold mb-2 bg-red-50 text-red-600 border border-red-200">
                  <i className="fa-solid fa-ban mr-1.5"></i>Cancelar pedido
                </button>
                <MensajeCocinaInput pedido={p} onGuardar={guardarMensajeCocina} />
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div className="pb-24">

      {/* ===================== HEADER NAVBAR ===================== */}
      <header className="bg-cafe-900 text-cafe-50 sticky top-0 z-40 shadow-xl border-b-4 border-bronce-500 animate-slide-down">
        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
          <div className="flex items-center gap-3 cursor-pointer group" onClick={() => { setCategoriaActiva('todas'); setBusqueda(''); }}>
            {config.logo && <img src={config.logo} alt="Logo" className="w-12 h-12 rounded-full object-cover border-2 border-bronce-400 group-hover:scale-110 group-hover:rotate-6 transition-all duration-300 bg-white" />}
            <div>
              <h1 className="text-xl sm:text-2xl font-heading text-brand-outline tracking-wide uppercase transition-transform group-hover:scale-105 leading-none">{NOMBRE_NEGOCIO}</h1>
              <p className="text-xs text-cafe-200 hidden sm:block opacity-80 mt-1">{TAGLINE}</p>
            </div>
          </div>

          <div className="flex items-center gap-3 sm:gap-4 flex-shrink-0">
            {config.whatsapp && (
              <a href={`https://wa.me/${config.whatsapp}`} target="_blank" rel="noreferrer" className="text-cafe-300 hover:text-bronce-400 transition-colors text-xl"><i className="fa-brands fa-whatsapp"></i></a>
            )}
            {config.instagram && (
              <a href={`https://instagram.com/${config.instagram}`} target="_blank" rel="noreferrer" className="text-cafe-300 hover:text-bronce-400 transition-colors text-xl"><i className="fa-brands fa-instagram"></i></a>
            )}
            <button onClick={abrirCarrito} className="relative p-2 text-cafe-50 hover:text-bronce-400 transition-colors transform hover:scale-110">
              <i className="fa-solid fa-basket-shopping text-2xl"></i>
              {carrito.length > 0 && (
                <span className="absolute -top-1 -right-1 bg-vino-600 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full animate-bounce-slight shadow-lg border border-cafe-900">
                  {cantidadCarrito}
                </span>
              )}
            </button>
            <button onClick={() => setMostrarAdminModal(true)} className="text-cafe-500 hover:text-cafe-300 transition-colors text-lg">
              <i className="fa-solid fa-user-gear"></i>
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 pt-6">
        {config.abierto === false && (
          <div className="mb-6 bg-vino-700 text-white rounded-2xl p-5 text-center shadow-lg animate-fade-in">
            <p className="font-heading text-2xl mb-1"><i className="fa-solid fa-store-slash mr-2"></i>¡Lo sentimos, estamos cerrados!</p>
            <p className="text-vino-100 text-sm">En este momento no estamos tomando pedidos. Podés ver el menú, pero el envío de pedidos está desactivado hasta que reabramos.</p>
          </div>
        )}
        {/* ===================== BUSCADOR ===================== */}
        <div className="relative mb-8 max-w-md mx-auto animate-fade-in delay-100">
          <input
            type="text"
            placeholder="¿Qué tenés ganas de comer hoy?"
            value={busqueda}
            onChange={(e) => setBusqueda(e.target.value)}
            className="w-full bg-white border-2 border-cafe-200 text-cafe-900 rounded-full py-3 px-12 shadow-sm focus:outline-none focus:border-bronce-400 focus:ring-4 focus:ring-bronce-400/20 transition-all font-semibold"
          />
          <i className="fa-solid fa-magnifying-glass absolute left-5 top-4 text-cafe-400"></i>
          {busqueda && (
            <button onClick={() => setBusqueda('')} className="absolute right-5 top-3.5 text-cafe-400 hover:text-vino-600 transition-colors">
              <i className="fa-solid fa-xmark text-lg"></i>
            </button>
          )}
        </div>

        {/* ===================== HERO / DESTACADO ===================== */}
        {productosDestacados.length > 0 && !busqueda && categoriaActiva === 'todas' && (
          <div className="mb-10 rounded-2xl overflow-hidden relative shadow-2xl animate-slide-up bg-cafe-900 border-2 border-bronce-500/30 group">
            <div className="absolute inset-0 bg-gradient-to-t from-cafe-900 via-cafe-900/60 to-transparent z-10"></div>
            {productosDestacados[sliderIndex % productosDestacados.length].imagen ? (
              <img
                key={sliderIndex}
                src={productosDestacados[sliderIndex % productosDestacados.length].imagen}
                className="w-full h-64 sm:h-80 object-cover opacity-80 group-hover:scale-105 group-hover:opacity-100 transition-all duration-700 animate-fade-in"
                alt="Destacado" />
            ) : <div className="w-full h-64 sm:h-80 bg-cafe-800"></div>}
            <div className="absolute bottom-0 left-0 w-full p-6 z-20">
              <span className="bg-vino-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block shadow-md">Recomendado</span>
              <h2 className="text-3xl sm:text-4xl font-heading text-bronce-400 drop-shadow-lg">{productosDestacados[sliderIndex % productosDestacados.length].nombre}</h2>
              {productosDestacados[sliderIndex % productosDestacados.length].descripcion && (
                <p className="text-cafe-100 mt-2 max-w-xl text-sm sm:text-base line-clamp-2 drop-shadow">{productosDestacados[sliderIndex % productosDestacados.length].descripcion}</p>
              )}
              <div className="mt-4 flex items-center justify-between">
                <span className="text-2xl font-bold text-white">${productosDestacados[sliderIndex % productosDestacados.length].precio}</span>
                <button onClick={() => abrirDetalle(productosDestacados[sliderIndex % productosDestacados.length])} className="bg-bronce-500 hover:bg-bronce-400 text-cafe-900 font-bold py-2 px-6 rounded-full shadow-lg transform hover:-translate-y-1 transition-all">
                  Pedir ahora <i className="fa-solid fa-arrow-right ml-1"></i>
                </button>
              </div>
              {productosDestacados.length > 1 && (
                <div className="flex gap-1.5 mt-4">
                  {productosDestacados.map((_, idx) => (
                    <span key={idx} className={`w-1.5 h-1.5 rounded-full transition-all ${idx === sliderIndex % productosDestacados.length ? 'bg-bronce-400 w-4' : 'bg-cafe-50/40'}`}></span>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

      {/* ===================== SEGUÍ TU PEDIDO ===================== */}
      <div className="mb-8 animate-fade-in delay-100">
        <div className="bg-cafe-900 rounded-2xl p-4 sm:p-5 shadow-lg">
          <p className="text-bronce-300 font-heading font-bold text-sm mb-2"><i className="fa-solid fa-magnifying-glass mr-1.5"></i>Seguí tu pedido</p>
          <div className="flex gap-2">
            <input
              value={numeroConsulta}
              onChange={e => setNumeroConsulta(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && buscarPedido()}
              placeholder="Número de pedido (ej: 12)"
              className="flex-1 border border-cafe-700 bg-cafe-800 text-cafe-50 placeholder-cafe-400 rounded-xl p-2.5 text-sm" />
            <button onClick={buscarPedido} className="bg-bronce-500 text-cafe-900 px-4 rounded-xl text-sm font-bold flex-shrink-0">Ver estado</button>
          </div>

          {pedidoConsultado === 'notfound' && (
            <p className="text-vino-500 text-sm mt-3">No encontramos ningún pedido con ese número.</p>
          )}

          {pedidoConsultado && pedidoConsultado !== 'notfound' && (
            <div className="mt-3 bg-cafe-800 rounded-xl p-3.5">
              <div className="flex justify-between items-center mb-2">
                <p className="font-heading font-bold text-bronce-300">Pedido #{pedidoConsultado.numero}</p>
                <span className="text-cafe-400 text-xs">{horaCorta(pedidoConsultado.creado)}</span>
              </div>
              {pedidoConsultado.estado === 'cancelado' ? (
                <div className="bg-vino-800/40 border border-vino-500/40 rounded-xl p-3 text-center mb-1">
                  <p className="text-vino-300 font-heading font-bold"><i className="fa-solid fa-circle-xmark mr-1.5"></i>Pedido cancelado</p>
                </div>
              ) : (
                <>
                  <div className="flex items-center justify-between gap-1 mb-3">
                    {['recibido', 'en_preparacion', 'en_camino'].map((est, idx) => {
                      const idxActual = ['recibido', 'en_preparacion', 'en_camino'].indexOf(pedidoConsultado.estado);
                      const activo = idxActual >= idx || pedidoConsultado.estado === 'entregado' || pedidoConsultado.estado === 'cobrado';
                      return (
                        <div key={est} className="flex-1 flex flex-col items-center gap-1">
                          <div className={`w-full h-1.5 rounded-full ${activo ? 'bg-bronce-500' : 'bg-cafe-700'}`}></div>
                          <span className={`text-[10px] text-center ${activo ? 'text-bronce-300 font-bold' : 'text-cafe-500'}`}>{etiquetaEstadoPedido(est, pedidoConsultado.modo)}</span>
                        </div>
                      );
                    })}
                  </div>
                  <p className="text-cafe-50 text-sm font-bold text-center">{etiquetaEstadoPedido(pedidoConsultado.estado, pedidoConsultado.modo)}</p>
                  {config.tiempoEstimado && (
                    <p className="text-cafe-400 text-xs text-center mt-1">Tiempo estimado: {config.tiempoEstimado}</p>
                  )}
                </>
              )}
              {pedidoConsultado.mensaje && (
                <p className="text-bronce-300 text-xs text-center mt-2 bg-cafe-900 rounded-lg p-2 border border-bronce-500/30"><i className="fa-solid fa-message mr-1"></i>{pedidoConsultado.mensaje}</p>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ===================== COMBOS Y PROMOS ===================== */}
      {listaCombos.length > 0 && (
        <div className="mb-8 animate-fade-in delay-150">
          <h2 className="font-heading text-lg font-bold text-cafe-900 mb-2 flex items-center gap-2"><i className="fa-solid fa-tags text-vino-600"></i>Combos y Promos</h2>
          <div className="flex gap-3 overflow-x-auto no-scrollbar pb-1">
            {listaCombos.map(c => (
              <div key={c.id} className="flex-shrink-0 w-56 bg-white rounded-lg border-2 border-bronce-400 overflow-hidden filete-borde relative">
                <span className="absolute top-2 left-2 bg-vino-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10">PROMO</span>
                <div className="w-full h-28 bg-cafe-100">
                  {c.imagen ? <img src={c.imagen} className="w-full h-full object-cover" /> : (
                    <div className="w-full h-full flex items-center justify-center text-cafe-300"><i className="fa-solid fa-tags text-2xl"></i></div>
                  )}
                </div>
                <div className="p-3">
                  <h3 className="font-heading font-bold text-cafe-900 leading-tight text-sm">{c.nombre}</h3>
                  {c.descripcion && <p className="text-xs text-cafe-500 mt-1 leading-snug line-clamp-2">{c.descripcion}</p>}
                  <div className="flex items-center justify-between mt-2">
                    <p className="font-heading font-bold text-vino-600">${c.precio}</p>
                    <button onClick={() => agregarComboAlCarrito(c)} disabled={config.abierto === false} className="w-8 h-8 rounded-full bg-cafe-900 text-bronce-300 flex items-center justify-center hover:bg-cafe-800 transition flex-shrink-0 disabled:opacity-30">
                      <i className="fa-solid fa-plus text-xs"></i>
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ===================== CATEGORÍAS ===================== */}
      <div className="flex gap-3 overflow-x-auto no-scrollbar pb-4 mb-6 animate-fade-in delay-200 px-1">
        <button
          onClick={() => setCategoriaActiva('todas')}
          className={`whitespace-nowrap px-6 py-2.5 rounded-full font-bold text-sm transition-all shadow-sm ${categoriaActiva === 'todas' ? 'bg-cafe-900 text-bronce-400 scale-105' : 'bg-white text-cafe-600 hover:bg-cafe-100 border border-cafe-200'}`}
        >
          Menú Completo
        </button>
        {categoriasConProductos.map(c => (
          <button
            key={c}
            onClick={() => setCategoriaActiva(c)}
            className={`whitespace-nowrap px-6 py-2.5 rounded-full font-bold text-sm transition-all shadow-sm ${categoriaActiva === c ? 'bg-cafe-900 text-bronce-400 scale-105' : 'bg-white text-cafe-600 hover:bg-cafe-100 border border-cafe-200'}`}
          >
            {c}
          </button>
        ))}
      </div>

      {/* ===================== MENÚ / GRILLA ===================== */}
      <div className="mb-10">
        {productosFiltrados.length === 0 && (
          <div className="text-center py-16 animate-fade-in">
            <i className="fa-solid fa-burger text-6xl text-cafe-200 mb-4 animate-bounce-slight"></i>
            <h3 className="text-2xl font-heading text-cafe-400">{listaProductos.length === 0 ? 'Todavía no hay ítems cargados' : 'No encontramos lo que buscás'}</h3>
            <p className="text-cafe-500">{listaProductos.length === 0 ? 'Se van a mostrar acá apenas se cargue el menú.' : 'Probá con otra búsqueda o categoría.'}</p>
          </div>
        )}
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          {productosFiltrados.map((p, idx) => (
            <div key={p.id} className="bg-white rounded-2xl overflow-hidden filete-borde flex flex-col group animate-slide-up cursor-pointer" style={{ animationDelay: `${(idx % 10) * 100}ms` }} onClick={() => abrirDetalle(p)}>
              <div className="h-48 overflow-hidden relative bg-cafe-50">
                {p.destacado && (
                  <div className="absolute top-3 left-3 bg-bronce-500 text-cafe-900 text-xs font-bold px-2 py-1 rounded shadow-md z-10 uppercase tracking-widest"><i className="fa-solid fa-star mr-1"></i>Top</div>
                )}
                {p.imagen ? <img src={p.imagen} alt={p.nombre} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" /> : (
                  <div className="w-full h-full flex items-center justify-center text-cafe-300"><i className="fa-solid fa-utensils text-3xl"></i></div>
                )}
              </div>
              <div className="p-5 flex-1 flex flex-col">
                <div className="flex justify-between items-start mb-2 gap-2">
                  <h3 className="text-xl font-heading text-cafe-900 leading-tight">{p.nombre}</h3>
                  <span className="text-lg font-bold text-vino-600 flex-shrink-0">${p.precio}</span>
                </div>
                {p.descripcion && <p className="text-cafe-500 text-sm mb-4 flex-1 line-clamp-3 leading-relaxed">{p.descripcion}</p>}
                <button
                  onClick={(e) => { e.stopPropagation(); abrirDetalle(p); }}
                  className="w-full bg-cafe-100 text-cafe-800 hover:bg-cafe-900 hover:text-bronce-400 font-bold py-3 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 mt-auto"
                >
                  <i className="fa-solid fa-circle-info"></i> Ver detalle
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ===================== ENCONTRANOS (MAPA + RESEÑAS) ===================== */}
      {config.direccion && (
        <div className="mb-10">
          <h2 className="font-heading text-xl font-bold text-cafe-900 mb-3 text-center">Encontranos</h2>
          <div className="rounded-xl overflow-hidden filete-borde">
            <iframe
              title="Ubicación"
              width="100%"
              height="220"
              style={{ border: 0 }}
              loading="lazy"
              src={`https://www.google.com/maps?q=${encodeURIComponent(config.direccion)}&output=embed`}>
            </iframe>
          </div>
          <p className="text-center text-sm text-cafe-600 mt-2"><i className="fa-solid fa-location-dot mr-1.5"></i>{config.direccion}</p>
          <div className="flex gap-2 mt-3">
            <a

                      href={linkCocina()} target="_blank" rel="noreferrer"
                      className="flex items-center justify-center gap-2 bg-cafe-900 text-bronce-300 py-2.5 rounded-xl text-xs font-bold">
                      <i className="fa-solid fa-kitchen-set"></i>Abrir vista cocina (para tablet/pantalla en la cocina)
                    </a>
                    {listaPedidos.length === 0 && <p className="text-cafe-400 text-xs text-center py-6">Todavía no llegó ningún pedido.</p>}
                    {listaPedidos.map(p => (
                      <div key={p.id} className={`border border-cafe-100 rounded-xl p-3 bg-white ${p.estado === 'cobrado' || p.estado === 'cancelado' ? 'opacity-50' : ''}`}>
                        <div className="flex justify-between items-start mb-1.5">
                          <div>
                            <p className="font-heading font-bold text-cafe-900">#{p.numero} · {etiquetaOrigenPedido(p)}</p>
                            <p className="text-[10px] text-cafe-400">{horaCorta(p.creado)}</p>
                          </div>
                          <p className="font-heading font-bold text-vino-600">${p.total}</p>
                        </div>
                        <div className="text-xs text-cafe-600 space-y-0.5 mb-2.5">
                          {(p.items || []).map((it, idx) => (
                            <p key={idx}>{it.cantidad}x {it.nombre}</p>
                          ))}
                        </div>
                        {p.aclaraciones && (
                          <p className="text-[11px] bg-bronce-500/10 border border-bronce-400/30 rounded-lg p-2 mb-2.5"><i className="fa-solid fa-circle-info mr-1 text-bronce-500"></i>{p.aclaraciones}</p>
                        )}
                        <button
                          onClick={() => avanzarEstadoPedido(p.id, p.estado)}
                          disabled={p.estado === 'cobrado' || p.estado === 'cancelado'}
                          className={`w-full py-2 rounded-xl text-xs font-bold ${ESTADO_ESTILO[p.estado] || ESTADO_ESTILO.recibido}`}>
                          {ESTADO_LABEL[p.estado] || 'Recibido'}{p.estado !== 'cobrado' && p.estado !== 'cancelado' && ' · tocar para avanzar'}
                        </button>
                        {p.estado !== 'cancelado' && p.estado !== 'cobrado' && (
                          <button onClick={() => cancelarPedido(p.id)} className="w-full py-1.5 rounded-xl text-[11px] font-bold mt-1.5 bg-red-50 text-red-600 border border-red-200">
                            <i className="fa-solid fa-ban mr-1"></i>Cancelar pedido
                          </button>
                        )}
                        <div className="mt-2">
                          <MensajeCocinaInput pedido={p} onGuardar={guardarMensajeCocina} />
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {adminTab === 'productos' && (
                  <div className="space-y-4">
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-white">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoId ? 'Editar ítem' : 'Nuevo ítem del menú'}</h4>
                      <input value={form.nombre} onChange={e => setForm({...form, nombre: e.target.value})} placeholder="Nombre del plato/bebida" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <select value={form.categoria} onChange={e => setForm({...form, categoria: e.target.value})} className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-white">
                        <option value="">Elegir categoría...</option>
                        {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      {categorias.length === 0 && <p className="text-xs text-vino-600">Primero cargá una categoría en la pestaña "Categorías".</p>}
                      <textarea value={form.descripcion} onChange={e => setForm({...form, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <input value={form.precio} onChange={e => setForm({...form, precio: e.target.value})} type="number" placeholder="Precio" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex items-center gap-3">
                        <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          <i className="fa-solid fa-camera mr-1.5"></i>Foto
                          <input type="file" accept="image/*" onChange={handleImagenProducto} className="hidden" />
                        </label>
                        {form.imagen && <img src={form.imagen} className="w-12 h-12 rounded-lg object-cover" />}
                      </div>

                      <label className="flex items-center gap-2 text-xs font-bold text-cafe-600">
                        <input type="checkbox" checked={!!form.destacado} onChange={e => setForm({...form, destacado: e.target.checked})} className="w-4 h-4" />
                        Mostrar en el banner de destacados del inicio
                      </label>

                      <div className="border-t border-cafe-100 pt-2">
                        <p className="text-xs font-bold text-cafe-500 mb-1.5">Opciones de personalización (ej: sin cebolla, agregar cheddar, agregar medallón)</p>
                        {(form.opciones || []).length > 0 && (
                          <div className="space-y-1 mb-2">
                            {form.opciones.map((o, idx) => (
                              <div key={idx} className="flex items-center justify-between bg-cafe-50 rounded-lg px-2 py-1 text-xs">
                                <span>{o.nombre}{Number(o.precioExtra) > 0 ? ` (+$${o.precioExtra})` : ''}</span>
                                <button onClick={() => quitarOpcionProducto(idx)} className="text-vino-600"><i className="fa-solid fa-xmark"></i></button>
                              </div>
                            ))}
                          </div>
                        )}
                        <div className="flex gap-1.5">
                          <input value={opcionProdNombre} onChange={e => setOpcionProdNombre(e.target.value)} placeholder="Ej: Sin cebolla, Agregar cheddar..." className="flex-1 border border-cafe-200 rounded-lg p-2 text-xs" />
                          <input value={opcionProdPrecio} onChange={e => setOpcionProdPrecio(e.target.value)} type="number" placeholder="Extra $" className="w-20 border border-cafe-200 rounded-lg p-2 text-xs" />
                          <button onClick={agregarOpcionProducto} className="bg-cafe-900 text-bronce-300 px-3 rounded-lg text-xs font-bold">+</button>
                        </div>
                        <p className="text-[11px] text-cafe-400 mt-1">Dejá el precio extra vacío o en 0 para opciones sin costo (ej: sin cebolla).</p>
                      </div>

                      <div className="border-t border-cafe-100 pt-2">
                        <p className="text-xs font-bold text-cafe-500 mb-1.5">Sabores a elegir (para bebidas, ej: Coca, Fanta, Sprite)</p>
                        {(form.sabores || []).length > 0 && (
                          <div className="flex flex-wrap gap-1.5 mb-2">
                            {form.sabores.map((s, idx) => (
                              <span key={idx} className="flex items-center gap-1.5 bg-cafe-50 rounded-full px-2.5 py-1 text-xs">
                                {s}
                                <button onClick={() => quitarSaborProducto(idx)} className="text-vino-600"><i className="fa-solid fa-xmark"></i></button>
                              </span>
                            ))}
                          </div>
                        )}
                        <div className="flex gap-1.5">
                          <input value={saborProdInput} onChange={e => setSaborProdInput(e.target.value)} placeholder="Ej: Coca-Cola" className="flex-1 border border-cafe-200 rounded-lg p-2 text-xs" />
                          <button onClick={agregarSaborProducto} className="bg-cafe-900 text-bronce-300 px-3 rounded-lg text-xs font-bold">+</button>
                        </div>
                      </div>

                      <div className="flex gap-2">
                        <button onClick={guardarProducto} className="flex-1 bg-cafe-900 text-bronce-300 py-2 rounded-xl text-xs font-bold">{editandoId ? 'Guardar cambios' : 'Agregar al menú'}</button>
                        {editandoId && <button onClick={resetForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    {listaProductos.length === 0 && (
                      <button onClick={cargarMenuInicial} className="w-full bg-vino-600 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                        <i className="fa-solid fa-burger"></i>Cargar menú inicial de Waysty (burgers, papas, nuggets, bebidas y combos)
                      </button>
                    )}

                    <div className="space-y-1.5">
                      {listaProductos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste ítems.</p>}
                      {listaProductos.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-white p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{p.imagen && <img src={p.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.nombre}</p>
                            <p className="text-cafe-400">{p.categoria} · ${p.precio}</p>
                          </div>
                          <button onClick={() => editarProducto(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarProducto(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'combos' && (
                  <div className="space-y-4">
                    <p className="text-xs text-cafe-500">Los combos y promos aparecen destacados arriba del menú, con su propio precio fijo, y se piden igual que cualquier ítem.</p>
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-white">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoComboId ? 'Editar combo/promo' : 'Nuevo combo/promo'}</h4>
                      <input value={comboForm.nombre} onChange={e => setComboForm({...comboForm, nombre: e.target.value})} placeholder="Ej: Combo Doble + Papas + Gaseosa" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <textarea value={comboForm.descripcion} onChange={e => setComboForm({...comboForm, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <input value={comboForm.precio} onChange={e => setComboForm({...comboForm, precio: e.target.value})} type="number" placeholder="Precio del combo" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <div className="flex items-center gap-3">
                        <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          <i className="fa-solid fa-camera mr-1.5"></i>Foto
                          <input type="file" accept="image/*" onChange={handleImagenCombo} className="hidden" />
                        </label>
                        {comboForm.imagen && <img src={comboForm.imagen} className="w-12 h-12 rounded-lg object-cover" />}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={guardarCombo} className="flex-1 bg-vino-600 text-white py-2 rounded-xl text-xs font-bold">{editandoComboId ? 'Guardar cambios' : 'Agregar combo/promo'}</button>
                        {editandoComboId && <button onClick={resetComboForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaCombos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste combos ni promos.</p>}
                      {listaCombos.map(c => (
                        <div key={c.id} className="flex items-center gap-2.5 border border-cafe-100 bg-white p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{c.imagen && <img src={c.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{c.nombre}</p>
                            <p className="text-cafe-400">${c.precio}</p>
                          </div>
                          <button onClick={() => editarCombo(c)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarCombo(c.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'categorias' && (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <input value={nuevaCategoria} onChange={e => setNuevaCategoria(e.target.value)} placeholder="Ej: Hamburguesas, Papas, Nuggets, Bebidas..." className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm" onKeyDown={e => e.key==='Enter' && agregarCategoria()} />
                      <button onClick={agregarCategoria} className="bg-cafe-900 text-bronce-300 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>
                    <div className="space-y-1.5">
                      {categorias.length === 0 && <p className="text-cafe-400 text-xs">Todavía no cargaste categorías.</p>}
                      {categorias.map(c => (
                        <div key={c} className="flex justify-between items-center border border-cafe-100 bg-white p-2.5 rounded-xl text-sm">
                          <span className="text-cafe-800 font-medium">{c}</span>
                          <button onClick={() => eliminarCategoria(c)} className="text-vino-600"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'chatbot' && (
                  <div className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Saludo inicial</label>
                      <textarea value={chatSaludoInput} onChange={e => setChatSaludoInput(e.target.value)} placeholder={SALUDO_BOT_DEFAULT} rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <button onClick={guardarSaludoBot} className="mt-1.5 bg-cafe-900 text-bronce-300 px-4 py-1.5 rounded-xl text-xs font-bold">Guardar saludo</button>
                    </div>

                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-white">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoPreguntaId ? 'Editar pregunta' : 'Nueva pregunta'}</h4>
                      <input value={preguntaForm.pregunta} onChange={e => setPreguntaForm({...preguntaForm, pregunta: e.target.value})} placeholder="Ej: ¿Hacen delivery?" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                      <textarea value={preguntaForm.respuesta} onChange={e => setPreguntaForm({...preguntaForm, respuesta: e.target.value})} placeholder="Respuesta" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm"></textarea>
                      <div className="flex gap-2">
                        <button onClick={guardarPreguntaBot} className="flex-1 bg-cafe-900 text-bronce-300 py-2 rounded-xl text-xs font-bold">{editandoPreguntaId ? 'Guardar cambios' : 'Agregar pregunta'}</button>
                        {editandoPreguntaId && <button onClick={resetPreguntaBotForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaPreguntasBot.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste preguntas.</p>}
                      {listaPreguntasBot.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-white p-2 rounded-xl text-xs">
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.pregunta}</p>
                            <p className="text-cafe-400 truncate">{p.respuesta}</p>
                          </div>
                          <button onClick={() => editarPreguntaBot(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarPreguntaBot(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'config' && (
                  <div className="space-y-3">
                    <div className={`rounded-xl p-3.5 flex items-center justify-between gap-3 border ${config.abierto !== false ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                      <div>
                        <p className={`font-bold text-sm ${config.abierto !== false ? 'text-green-700' : 'text-red-700'}`}>
                          <i className={`fa-solid ${config.abierto !== false ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1.5`}></i>
                          {config.abierto !== false ? 'Local abierto' : 'Local cerrado'}
                        </p>
                        <p className="text-[11px] text-cafe-500 mt-0.5">{config.abierto !== false ? 'Los clientes pueden hacer pedidos.' : 'Los clientes ven un cartel de "cerrado" y no pueden pedir.'}</p>
                      </div>
                      <button onClick={toggleLocalAbierto} className={`flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold ${config.abierto !== false ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`}>
                        {config.abierto !== false ? 'Cerrar local' : 'Abrir local'}
                      </button>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Tiempo estimado de espera (se muestra al cliente)</label>
                      <input value={tiempoEstimadoInput} onChange={e => setTiempoEstimadoInput(e.target.value)} placeholder="Ej: 30-40 min" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Logo</label>
                      <div className="flex items-center gap-3">
                        {config.logo && <img src={config.logo} className="w-12 h-12 rounded-full object-cover" />}
                        <label className="bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          Subir logo<input type="file" accept="image/*" onChange={handleLogo} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">WhatsApp (solo números, con código de país)</label>
                      <input value={whatsappInput} onChange={e => setWhatsappInput(e.target.value)} placeholder="5491122334455" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Instagram (usuario, sin @)</label>
                      <input value={instagramInput} onChange={e => setInstagramInput(e.target.value)} placeholder="waysty.ar" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Dirección</label>
                      <input value={direccionInput} onChange={e => setDireccionInput(e.target.value)} placeholder="Calle 48 2085, ..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div className="border-t border-cafe-100 pt-3">
                      <p className="text-xs font-bold text-cafe-700 mb-2">Medios de pago</p>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Alias para transferencia</label>
                      <input value={aliasInput} onChange={e => setAliasInput(e.target.value)} placeholder="waysty.mp" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm" />
                    </div>
                    <div className="border-t border-cafe-100 pt-3">
                      <p className="text-xs font-bold text-cafe-700 mb-2">Usuario y contraseña de acceso al admin</p>
                      <p className="text-[11px] text-cafe-400 mb-2">Usuario actual: <span className="font-bold text-cafe-600">{adminAuth.usuario}</span></p>
                      <input value={nuevoUsuarioAdmin} onChange={e => setNuevoUsuarioAdmin(e.target.value)} placeholder={`Nuevo usuario (dejar vacío para mantener "${adminAuth.usuario}")`} className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm mb-2" />
                      <input value={nuevaContrasenaAdmin} onChange={e => setNuevaContrasenaAdmin(e.target.value)} type="password" placeholder="Nueva contraseña (dejar vacía para no cambiarla)" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm mb-2" />
                      <input value={confirmarContrasenaAdmin} onChange={e => setConfirmarContrasenaAdmin(e.target.value)} type="password" placeholder="Repetir nueva contraseña" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm mb-2" />
                      {avisoCredencialesAdmin && <p className={`text-xs mb-2 ${avisoCredencialesAdmin.startsWith('¡Listo') ? 'text-green-600' : 'text-vino-600'}`}>{avisoCredencialesAdmin}</p>}
                      <button onClick={guardarCredencialesAdmin} className="w-full bg-cafe-100 text-cafe-800 py-2.5 rounded-xl text-sm font-bold">Actualizar usuario y contraseña</button>
                    </div>
                    <button onClick={guardarConfig} className="w-full bg-cafe-900 text-bronce-300 py-2.5 rounded-xl text-sm font-bold">Guardar configuración</button>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
