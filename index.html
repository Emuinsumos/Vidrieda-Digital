<!DOCTYPE html>
<html lang="es">
<head>
<meta property="og:image" content="https://tuvidrieradigital.vercel.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu vidriera digital — Catálogos web a medida para tu comercio</title>
<meta name="description" content="Catálogo, carrito, cobros y panel de administración en una sola página, adaptada a tu rubro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root{
    /* Paleta modernizada */
    --paper: #FAFAFA;
    --linen: #F3F4F6;
    --ink: #111827;
    --ink-soft: #4B5563;
    --coral: #FF5A36;
    --coral-dark: #E14523;
    --teal: #0D9488;
    --mostaza: #F59E0B;
    --line: rgba(17, 24, 39, 0.1);
  }
  *{box-sizing:border-box;}
  button{font:inherit;}
  html{scroll-behavior:smooth;}
  section[id]{scroll-margin-top:84px;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .mono{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.02em;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  a{color:inherit;}
  img,svg{display:block;}

  /* ---------- ANIMACIONES ---------- */
  @keyframes float {
    0% { transform: translateY(0px) rotate(2deg); }
    50% { transform: translateY(-12px) rotate(1deg); }
    100% { transform: translateY(0px) rotate(2deg); }
  }
  
  /* ---------- NAV ---------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(250, 250, 250, 0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    transition: all 0.3s ease;
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);}
  .nav-links{display:flex;gap:28px;font-size:0.92rem;color:var(--ink-soft); font-weight: 500;}
  .nav-links a{text-decoration:none;transition:color .2s;}
  .nav-links a:hover{color:var(--coral);}
  
  /* Botones mejorados */
  .btn{
    display:inline-flex;align-items:center;justify-content: center;gap:8px;
    padding:12px 22px;border-radius:999px;
    font-weight:600;font-size:0.92rem;
    text-decoration:none;border:none;cursor:pointer;
    transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn i { font-size: 1.1rem; }
  .btn:hover{transform:translateY(-2px) scale(1.02);}
  .btn:active{transform:translateY(0) scale(0.98);}
  
  .btn-coral{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(255,90,54,0.25);}
  .btn-coral:hover{background:var(--coral-dark); box-shadow:0 10px 25px rgba(255,90,54,0.35);}
  
  .btn-insta{
    background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    color:#fff;box-shadow:0 8px 20px rgba(188,24,136,0.25);
  }
  .btn-insta:hover{box-shadow:0 10px 25px rgba(188,24,136,0.35); filter: brightness(1.1);}
  
  .btn-whatsapp{background:#25D366;color:#fff;box-shadow:0 8px 20px rgba(37,211,102,0.25);}
  .btn-whatsapp:hover{background:#1EBE57; box-shadow:0 10px 25px rgba(37,211,102,0.35);}
  
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink); background: rgba(17,24,39,0.03);}
  @media (max-width:760px){ .nav-links{display:none;} }

  /* ---------- HERO ---------- */
  .hero{padding:80px 0 60px;position:relative;overflow:hidden; background: radial-gradient(circle at top right, rgba(255,90,54,0.05), transparent 40%);}
  .hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center;}
  @media (max-width:900px){ .hero-grid{grid-template-columns:1fr; text-align: center;} .hero-actions{justify-content: center;} }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:0.78rem;
    color:var(--teal);background:rgba(13,148,136,0.1);
    padding:6px 14px;border-radius:999px;margin-bottom:24px;
    font-weight: 600;
  }
  .eyebrow::before{content:'●';color:var(--coral); font-size: 0.6rem;}
  h1.headline{font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.05;}
  h1.headline em{font-style:italic;color:var(--coral);}
  .sub{margin-top:24px;font-size:1.1rem;color:var(--ink-soft);max-width:48ch; line-height: 1.6;}
  @media (max-width:900px){ .sub{margin-left: auto; margin-right: auto;} }
  .hero-actions{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;}
  .hero-note{margin-top:20px;font-size:0.85rem;color:var(--ink-soft); opacity: 0.8;}

  /* phone demo animado */
  .phone{
    width:280px;margin:0 auto;
    background:#fff;border-radius:36px;
    border:10px solid var(--ink);
    box-shadow:0 30px 60px -15px rgba(17,24,39,0.3);
    overflow:hidden;
    animation: float 6s ease-in-out infinite; /* Animación de flotación */
  }
  .phone-head{padding:20px 16px 14px;transition:background .6s ease;}
  .phone-brand{font-family:'Fraunces',serif;font-weight:600;color:#fff;font-size:1.1rem;transition:color .6s ease;}
  .phone-tag{font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:rgba(255,255,255,0.85);margin-top:4px;}
  .phone-pills{display:flex;gap:6px;padding:12px 14px;overflow:hidden;}
  .pill{font-size:0.65rem;padding:6px 12px;border-radius:999px;background:var(--linen);color:var(--ink-soft);white-space:nowrap;font-family:'Inter',sans-serif; font-weight: 500;}
  .pill.active{background:var(--ink);color:#fff;}
  .phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px 20px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px; transition: transform 0.2s;}
  .card:hover{transform: scale(1.03);}
  .card .ph{height:48px;border-radius:8px;margin-bottom:8px;transition:background .6s ease;}
  .card .nm{font-size:0.65rem;font-weight:600; color:var(--ink);}
  .card .pr{font-size:0.65rem;font-family:'JetBrains Mono',monospace;color:var(--coral);margin-top:4px; font-weight: 600;}
  .phone-caption{text-align:center;margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--ink-soft);}
  .phone-caption b{color:var(--ink);}

  /* ---------- SECTION BASE ---------- */
  section{padding:88px 0;}
  .section-linen{background:var(--linen);}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--coral);margin-bottom:12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;}
  .section-head{max-width:640px;margin-bottom:56px;}
  .section-head h2{font-size:clamp(1.8rem,3.2vw,2.5rem); line-height: 1.15;}
  .section-head p{margin-top:16px;color:var(--ink-soft);font-size:1.05rem; line-height: 1.6;}

  /* ---------- PROBLEMAS (tickets) ---------- */
  .tickets{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  @media (max-width:820px){ .tickets{grid-template-columns:1fr;} }
  .ticket{
    background:#fff;border-radius:12px;padding:28px 24px;
    border:1px solid var(--line);
    background-image:repeating-linear-gradient(90deg, transparent, transparent 6px, var(--paper) 6px, var(--paper) 12px);
    background-position:bottom;background-size:100% 3px;background-repeat:no-repeat;
    position:relative;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .ticket:hover {
    transform: translateY(-5px) !important; 
    box-shadow: 0 12px 24px -5px rgba(0, 0, 0, 0.1);
  }
  .ticket:nth-child(2){transform:rotate(-0.8deg);}
  .ticket:nth-child(3){transform:rotate(0.8deg);}
  .ticket .num{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--teal); font-weight: 600;}
  .ticket h3{font-size:1.15rem;margin-top:12px; color: var(--ink);}
  .ticket p{margin-top:12px;color:var(--ink-soft);font-size:0.95rem; line-height: 1.6;}

  /* ---------- HERRAMIENTAS ---------- */
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  @media (max-width:900px){ .tools{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .tools{grid-template-columns:1fr;} }
  .tool{background:var(--paper);padding:32px 28px; transition: background 0.3s;}
  .tool:hover{background: #fff;}
  .tool-icon{width:42px;height:42px;margin-bottom:20px;}
  .tool h3{font-size:1.05rem;margin-bottom:10px; color:var(--ink);}
  .tool p{font-size:0.92rem;color:var(--ink-soft); line-height: 1.5;}
  .tool .use{
    margin-top:16px;font-size:0.75rem;color:var(--teal);
    font-family:'JetBrains Mono',monospace; font-weight: 600;
  }

  /* ---------- ADAPTACIONES ---------- */
  .rubros{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:900px){ .rubros{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .rubros{grid-template-columns:1fr;} }
  .rubro{
    border-radius:20px;padding:28px;color:#fff;min-height:160px;
    display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
  }
  .rubro:hover{transform: translateY(-4px);}
  .rubro::after{content:'';position:absolute;right:-30px;bottom:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.1); transition: transform 0.4s;}
  .rubro:hover::after{transform: scale(1.2);}
  .rubro .icon{font-size:1.8rem; margin-bottom: 16px;}
  .rubro h3{font-size:1.15rem;color:#fff; margin-bottom: 6px;}
  .rubro span{font-family:'JetBrains Mono',monospace;font-size:0.75rem;opacity:0.9;}

  /* ---------- CASO REAL ---------- */
  .caso{
    display:grid;grid-template-columns:0.9fr 1.1fr;gap:48px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
  }
  @media (max-width:820px){ .caso{grid-template-columns:1fr;} }
  .caso-shot{
    background:linear-gradient(160deg,#FBD8E4,#CDEDE8);
    border-radius:16px;padding:32px;color:var(--ink);
    font-family:'Fraunces',serif;
    position: relative;
    overflow: hidden;
  }
  .caso-shot::before {content:''; position:absolute; top:0; left:0; right:0; bottom:0; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.2)"/></svg>') no-repeat center center; opacity: 0.5;}
  .caso-shot .badge{font-family:'JetBrains Mono',monospace;font-size:0.7rem;background:rgba(255,255,255,0.8);display:inline-block;padding:6px 12px;border-radius:999px;margin-bottom:16px; font-weight: 600;}
  .caso-shot h3{font-size:1.7rem; position:relative; z-index: 1;}
  .caso-shot p {position:relative; z-index: 1;}
  .caso ul{padding-left:20px;margin:24px 0;color:var(--ink-soft);font-size:0.98rem; line-height: 1.6;}
  .caso li{margin-bottom:12px;}
  .caso li::marker { color: var(--coral); }

  /* ---------- COMO FUNCIONA ---------- */
  .pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:paso;}
  @media (max-width:900px){ .pasos{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .pasos{grid-template-columns:1fr;} }
  .paso{position:relative;padding-top:12px; border-top: 2px solid var(--line); transition: border-color 0.3s;}
  .paso:hover{border-color: var(--coral);}
  .paso .n{
    font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--coral);
    border:2px solid var(--coral);border-radius:999px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;margin-bottom:20px;
    font-weight: 600; background: var(--paper);
    margin-top: -32px;
  }
  .paso h3{font-size:1.05rem;margin-bottom:10px; color: var(--ink);}
  .paso p{font-size:0.92rem;color:var(--ink-soft); line-height: 1.5;}

  /* ---------- PLANES ---------- */
  .planes{display:grid;grid-template-columns:repeat(2,1fr);gap:32px; max-width: 900px; margin: 0 auto;}
  @media (max-width:760px){ .planes{grid-template-columns:1fr;} }
  .plan{
    background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px;position:relative;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .plan:hover{transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);}
  .plan.destacado{border:2px solid var(--coral); transform: scale(1.02);}
  .plan.destacado:hover{transform: scale(1.02) translateY(-8px);}
  .plan .tag{position:absolute;top:-14px;right:32px;background:var(--coral);color:#fff;font-family:'JetBrains Mono',monospace;font-size:0.7rem;padding:6px 14px;border-radius:999px; font-weight: 600;}
  .plan h3{font-size:1.3rem; color: var(--ink);}
  .plan .precio{font-family:'JetBrains Mono',monospace;font-size:2rem;margin:16px 0 8px;color:var(--ink); font-weight: 600;}
  .plan .precio span{font-size:0.9rem;color:var(--ink-soft);font-family:'Inter',sans-serif; font-weight: 400;}
  .plan ul{list-style:none;padding:0;margin:28px 0;}
  .plan li{padding:12px 0;border-top:1px dashed var(--line);font-size:0.95rem;color:var(--ink-soft); display: flex; align-items: flex-start; gap: 8px;}
  .plan li:first-child{border-top:none;}
  .plan li::before{content:'\f00c'; font-family: "FontAwesome"; color:var(--teal); font-weight:900; margin-top: 2px;}

  /* ---------- FAQ ---------- */
  .faq{max-width:760px; margin: 0 auto;}
  .faq-item{border-bottom:1px solid var(--line);padding:24px 0;}
  .faq-q{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600;font-size:1.05rem; color: var(--ink); transition: color 0.2s;}
  .faq-q:hover{color: var(--coral);}
  .faq-q .plus{font-family:'JetBrains Mono',monospace;color:var(--coral);transition:transform .3s ease; font-size: 1.2rem;}
  .faq-item.open .plus{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease;color:var(--ink-soft);font-size:0.98rem; line-height: 1.6;}
  .faq-item.open .faq-a{max-height:300px;margin-top:16px;}

  /* ---------- CTA FINAL ---------- */
  .cta-final{
    background:var(--ink);
    background-image: radial-gradient(circle at 100% 100%, #1F2937, var(--ink));
    color:var(--paper);border-radius:32px;
    padding:72px 40px;text-align:center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  .cta-final h2{color:#fff;font-size:clamp(1.8rem,3.6vw,2.6rem);}
  .cta-final p{color:rgba(250,246,238,0.8);margin-top:20px;max-width:52ch;margin-left:auto;margin-right:auto; font-size: 1.1rem;}
  .cta-final .hero-actions{justify-content:center;margin-top:36px;}

  footer{padding:40px 0;text-align:center;font-size:0.9rem;color:var(--ink-soft); font-weight: 500;}

  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease-out, transform .7s ease-out;}
  .reveal.show{opacity:1;transform:none;}

  /* ---------- MODAL "QUÉ INCLUYE" ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(17,24,39,0.7);backdrop-filter: blur(4px); z-index:200;display:flex;align-items:center;justify-content:center;padding:20px; opacity: 0; pointer-events: none; transition: opacity 0.3s;}
  .modal-overlay.show{opacity: 1; pointer-events: all;}
  .modal-box{background:var(--paper);border-radius:24px;max-width:920px;width:100%;max-height:90vh;overflow-y:auto;padding:32px;box-shadow:0 40px 80px -20px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s; scrollbar-width: thin;}
  .modal-overlay.show .modal-box {transform: translateY(0);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
  .modal-head h3{font-size:1.5rem; color: var(--ink);}
  .modal-head p{color:var(--ink-soft);font-size:0.95rem;margin-top:8px;}
  .modal-close{background:var(--linen);border:none;width:38px;height:38px;border-radius:50%;font-size:1.1rem;cursor:pointer;color:var(--ink);flex-shrink:0; transition: background 0.2s;}
  .modal-close:hover{background: #E5E7EB;}
  .modal-tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:28px;padding-bottom:8px; scrollbar-width: none;}
  .modal-tabs::-webkit-scrollbar { display: none; }
  .mtab{white-space:nowrap;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:0.9rem;cursor:pointer;color:var(--ink-soft); transition: all 0.2s; font-weight: 500;}
  .mtab:hover{border-color: var(--ink-soft);}
  .mtab.active{background:var(--ink);color:#fff;border-color:var(--ink); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);}
  .mpane{display:none;}
  .mpane.show{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center; animation: fadeIn 0.4s ease;}
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width:700px){ .mpane.show{grid-template-columns:1fr;} }
  .mpane h4{font-size:1.2rem;margin-bottom:12px; color: var(--ink);}
  .mpane p{color:var(--ink-soft);font-size:0.98rem; line-height: 1.6;}
  .mock{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);}
  
  /* Resto de estilos del mock iguales pero más redondeados */
  .mock-dots{display:flex;gap:6px;margin-bottom:16px;}
  .mock-dots span{width:10px;height:10px;border-radius:50%;background:var(--line);}
  .mock-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);font-size:0.9rem; font-weight: 500;}
  .mock-row:last-child{border-bottom:none;}
  .mock-qty{display:flex;align-items:center;gap:12px;}
  .mock-qty span{width:26px;height:26px;border-radius:6px;background:var(--linen);display:flex;align-items:center;justify-content:center;font-size:0.8rem; cursor: pointer;}
  .mock-total{display:flex;justify-content:space-between;font-weight:700;padding-top:14px;margin-top:8px;border-top:2px solid var(--ink); font-size: 1.1rem;}
  .mock-sidebar{display:flex;flex-direction:column;gap:8px;width:120px;flex-shrink:0;}
  .mock-side-item{font-size:0.8rem;padding:10px 12px;border-radius:8px;color:var(--ink-soft); font-weight: 500;}
  .mock-side-item.active{background:var(--coral);color:#fff;font-weight:600;}
  .mock-admin{display:flex;gap:20px;}
  .mock-field{font-size:0.75rem;color:var(--ink-soft);margin-bottom:6px; font-weight: 500;}
  .mock-input{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:0.85rem;margin-bottom:14px;color:var(--ink-soft); width: 100%;}
  .mock-btn{background:var(--coral);color:#fff;border-radius:8px;text-align:center;padding:10px;font-size:0.85rem;font-weight:600; cursor: pointer;}
  .mock-receipt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;transform:rotate(-1.5deg);position:relative;font-family:'JetBrains Mono',monospace; box-shadow: 5px 5px 15px rgba(0,0,0,0.05);}
  .mock-receipt::before{content:'';position:absolute;top:-8px;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,var(--paper) 0 8px, transparent 8px 16px);}
  .mock-r-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .mock-r-head .logo-dot{width:28px;height:28px;border-radius:50%;background:var(--coral);}
  .mock-r-head b{font-family:'Fraunces',serif;font-size:1.1rem;}
  .
