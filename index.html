function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  );
}

  function fechaISO(ts) {
    const d = new Date(ts || Date.now());

    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

    setSelInsumoProd(''); setCantInsumoProd('');

  function editarProducto(p) {
    setForm({ nombre: p.nombre, categoria: p.categoria, descripcion: p.descripcion || '', precio: String(p.precio), imagen: p.imagen || '', insumos: p.insumos || [], destacado: !!p.destacado, badge: p.badge || '' });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function guardarProducto() {
    if (!form.nombre || !form.categoria || !form.precio) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/' + id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      precio: Number(form.precio),
      imagen: form.imagen || '',
      insumos: form.insumos || [],
      destacado: !!form.destacado,
      badge: form.badge || ''
    });
    resetForm();
  }
  function eliminarProducto(id) {
    if (confirm('¿Eliminar este ítem del menú?')) db.ref('productos/' + id).remove();

  // Carga inicial con las hamburguesas del menú (se ejecuta una sola vez, a mano, desde el panel)
  function cargarMenuInicial() {
    if (!confirm('Esto va a crear las categorías "Smash Burgers", "Gourmet", "Papas & Sides" y "Bebidas", y cargar el menú de ejemplo de Smash & Co. ¿Continuar?')) return;
    const nuevasCategorias = ['Smash Burgers', 'Gourmet', 'Papas & Sides', 'Bebidas'];
    const categoriasFinales = [...categorias, ...nuevasCategorias.filter(c => !categorias.includes(c))];
    db.ref('categorias').set(categoriasFinales);
    // [nombre, categoria, descripcion, precio, destacado, badge]
    const items = [
      ['Classic Double Smash', 'Smash Burgers', 'Doble medallón de 90g, doble cheddar, salsa secreta, pan brioche', 8500, true, 'mas_vendido'],
      ['Bacon & Cheddar Monster', 'Smash Burgers', 'Doble medallón, panceta ahumada crocante, extra cheddar, cebolla caramelizada', 9800, true, 'promo'],
      ['Triple Truffle Burger', 'Gourmet', 'Triple medallón, cheddar, alioli de trufa, cebolla crispy', 12500, false, ''],
      ['Veggie Mushroom Smash', 'Gourmet', 'Medallón de hongo portobello y garbanzo, cheddar vegano, rúcula', 8900, false, ''],
      ['Papas Cheddar & Bacon', 'Papas & Sides', 'Papas fritas bañadas en cheddar fundido y panceta crocante', 5200, false, ''],
      ['Papas Clásicas', 'Papas & Sides', 'Papas fritas de corte artesanal con nuestra sal de la casa', 3800, false, ''],
      ['Limonada Casera', 'Bebidas', 'Limonada natural con menta, bien fría', 3200, false, ''],
      ['Coca-Cola 350ml', 'Bebidas', 'Lata bien fría', 2500, false, ''],
    ];
    const updates = {};
    items.forEach(([nombre, categoria, descripcion, precio, destacado, badge]) => {
      const id = db.ref('productos').push().key;
      updates['productos/' + id] = { nombre, categoria, descripcion, precio, imagen: '', insumos: [], destacado, badge };
    });
    db.ref().update(updates);
  }
  function handleImagenProducto(e) {

  function agregarInsumoAProducto() {

      return;
    }
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function agregarAlCarrito(p) {
    setCarrito(prev => {
      const existe = prev.find(it => it.id === p.id);
      if (existe) return prev.map(it => it.id === p.id ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, insumos: p.insumos || [] }];
    });
  }
  function agregarComboAlCarrito(c) {
    const cartId = 'combo-' + c.id;
    setCarrito(prev => {
      const existe = prev.find(it => it.id === cartId);
      if (existe) return prev.map(it => it.id === cartId ? { ...it, cantidad: it.cantidad + 1 } : it);
      return [...prev, { id: cartId, nombre: c.nombre, precio: c.precio, cantidad: 1, insumos: c.insumos || [] }];
    });
  }
  function cambiarCantidadCarrito(id, delta) {
    setCarrito(prev => prev
      .map(it => it.id === id ? { ...it, cantidad: it.cantidad + delta } : it)
      .filter(it => it.cantidad > 0));
  }
  const totalCarrito = carrito.reduce((a, it) => a + it.cantidad * it.precio, 0);
  const cantidadCarrito = carrito.reduce((a, it) => a + it.cantidad, 0);

  function puedeEnviarPedido() {
    if (carrito.length === 0) return false;
    if (modoConsumo === 'delivery') return !!pedidoForm.nombre && !!pedidoForm.telefono && !!pedidoForm.direccion;
    return !!pedidoForm.nombre; // take away
  }

  function descontarStockPorPedido(items) {
    const updates = {};
    items.forEach(it => {
      (it.insumos || []).forEach(ins => {
        const totalUsado = ins.cantidad * it.cantidad;
        if (!totalUsado) return;
        updates['insumos/' + ins.insumoId + '/cantidad'] = firebase.database.ServerValue.increment(-totalUsado);
      });
    });
    if (Object.keys(updates).length > 0) db.ref().update(updates);
  }

  const [metodoPagoSel, setMetodoPagoSel] = useState(null); // null | 'efectivo' | 'transferencia' | 'qr'
  const [montoEfectivo, setMontoEfectivo] = useState('');

  function confirmarMetodoPago(metodo) {
    if (!puedeEnviarPedido() || !config.whatsapp) return;
    if (metodo === 'transferencia' && !config.alias) return;
    if (metodo === 'qr' && !config.qrPago) return;
    setMetodoPagoSel(metodo);
  }

  function enviarPedido() {
    const metodo = metodoPagoSel;
    if (!puedeEnviarPedido() || !metodo || !config.whatsapp) return;
    setEnviandoPedido(true);

    db.ref('contadorPedidos').transaction(actual => (actual || 0) + 1).then(res => {
      const numero = res.snapshot.val();
      const pedidoData = {
        numero,
        modo: modoConsumo,
        nombre: pedidoForm.nombre || null,
        telefono: pedidoForm.telefono || null,
        direccion: pedidoForm.direccion || null,
        items: carrito,
        total: totalCarrito,
        pago: { metodo, monto: metodo === 'efectivo' ? (montoEfectivo || null) : null },
        estado: 'recibido',
        mensaje: '',
        creado: Date.now()
      };

      db.ref('pedidos').push().set(pedidoData).then(() => {
        descontarStockPorPedido(carrito);
        const lineas = [];
        lineas.push(`Pedido #${numero} - ${NOMBRE_NEGOCIO}`);
        if (modoConsumo === 'takeaway') lineas.push(`Modo: Take away - ${pedidoForm.nombre}`);
        if (modoConsumo === 'delivery') {
          lineas.push(`Modo: Delivery`);
          lineas.push(`Cliente: ${pedidoForm.nombre}`);
          lineas.push(`Teléfono: ${pedidoForm.telefono}`);
          lineas.push(`Dirección: ${pedidoForm.direccion}`);
        }
        lineas.push('-------------------------');
        carrito.forEach(it => lineas.push(`${it.cantidad}x ${it.nombre} - $${it.cantidad * it.precio}`));
        lineas.push('-------------------------');
        lineas.push(`Total: $${totalCarrito}`);
        if (metodo === 'efectivo') lineas.push(`Pago: Efectivo - abona con $${montoEfectivo || totalCarrito}`);
        if (metodo === 'transferencia') lineas.push(`Pago: Transferencia - envío el comprobante`);
        if (metodo === 'qr') lineas.push(`Pago: QR - envío el comprobante`);
        const mensajeWsp = encodeURIComponent(lineas.join('\n'));
        window.open(`https://wa.me/${config.whatsapp}?text=${mensajeWsp}`, '_blank');
        setConfirmacionPedido(`¡Pedido #${numero} enviado! Guardá este número para seguir el estado en "Seguí tu pedido".`);
        setCarrito([]);
        setPedidoForm({ nombre: '', telefono: '', direccion: '' });
        setMetodoPagoSel(null);
        setMontoEfectivo('');
        setMostrarCarrito(false);
        setEnviandoPedido(false);
      });
    }).catch(() => setEnviandoPedido(false));
  }
  function cerrarConfirmacionPedido() {
    setConfirmacionPedido(null);
    setPedidoForm({ nombre: '', telefono: '', direccion: '' });
    setMostrarCarrito(false);
  }

  const ESTADOS_PEDIDO = ['recibido', 'en_preparacion', 'en_camino', 'entregado', 'cobrado'];
  const ESTADO_LABEL = { recibido: 'Recibido', en_preparacion: 'En preparación', en_camino: 'En camino / listo', entregado: 'Entregado', cobrado: 'Cobrado' };
  const ESTADO_ESTILO = {
    recibido: 'bg-sky-100 text-sky-700',
    en_preparacion: 'bg-bronce-200 text-cafe-800',
    en_camino: 'bg-orange-100 text-orange-700',
    entregado: 'bg-purple-100 text-purple-700',
    cobrado: 'bg-green-100 text-green-700'
  };
  const listaPedidos = Object.entries(pedidos).map(([id, p]) => ({ id, ...p })).sort((a,b) => (b.creado||0) - (a.creado||0));

  const pedidosCajaSel = listaPedidos.filter(p => fechaISO(p.creado) === fechaCajaSeleccionada);
  const cobradosCajaSel = pedidosCajaSel.filter(p => p.estado === 'cobrado');
  const abiertosCajaSel = pedidosCajaSel.filter(p => p.estado !== 'cobrado');
  const totalCajaSel = cobradosCajaSel.reduce((a, p) => a + (p.total || 0), 0);
  const totalPorCobrarSel = abiertosCajaSel.reduce((a, p) => a + (p.total || 0), 0);
  const desglosePorModoSel = { takeaway: 0, delivery: 0 };
  cobradosCajaSel.forEach(p => { desglosePorModoSel[p.modo] = (desglosePorModoSel[p.modo] || 0) + (p.total || 0); });

  function etiquetaFecha(fechaStr) {
    if (fechaStr === fechaISO()) return 'Hoy';
    const [y, m, d] = fechaStr.split('-').map(Number);
    const fecha = new Date(y, m - 1, d);
    const texto = fecha.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  const historialDias = (() => {
    const mapa = {};
    listaPedidos.filter(p => p.estado === 'cobrado').forEach(p => {
      const f = fechaISO(p.creado);
      mapa[f] = (mapa[f] || 0) + (p.total || 0);
    });
    return Object.entries(mapa).map(([fecha, total]) => ({ fecha, total })).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 14);
  })();

  const topProductos = (() => {
    const conteo = {};
    listaPedidos.filter(p => p.estado === 'cobrado').forEach(p => {
      (p.items || []).forEach(it => {
        if (!conteo[it.nombre]) conteo[it.nombre] = { nombre: it.nombre, cantidad: 0, total: 0 };
        conteo[it.nombre].cantidad += it.cantidad;
        conteo[it.nombre].total += it.cantidad * it.precio;
      });
    });
    return Object.values(conteo).sort((a, b) => b.cantidad - a.cantidad).slice(0, 10);
  })();

  function linkCocina() {
    return `${window.location.origin}${window.location.pathname}?cocina=1`;
  }

  function avanzarEstadoPedido(id, estadoActual) {
    const idx = ESTADOS_PEDIDO.indexOf(estadoActual);
    if (idx === -1 || idx === ESTADOS_PEDIDO.length - 1) return;
    db.ref('pedidos/' + id + '/estado').set(ESTADOS_PEDIDO[idx + 1]);
  }
  function horaCorta(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }
  function etiquetaOrigenPedido(p) {
    if (p.modo === 'takeaway') return `Take away - ${p.nombre}`;
    return `Delivery - ${p.nombre}`;
  }
  function etiquetaEstadoPedido(estado, modo) {
    if (estado === 'recibido') return 'Recibido';

    if (estado === 'en_camino') return modo === 'delivery' ? 'En camino' : 'Listo para retirar';
    if (estado === 'entregado') return 'Entregado';
    if (estado === 'cobrado') return 'Cobrado';
    return estado;
  }

  const listaPreguntasBot = Object.entries(chatbotConfig.preguntas || {}).map(([id, p]) => ({ id, ...p }));
  const SALUDO_BOT_DEFAULT = '¡Hola! 👋 Soy el asistente de The Papa\'s Brothers. Elegí una pregunta:';

    setEditandoPreguntaId(null);

    setPreguntaForm({ pregunta: p.pregunta, respuesta: p.respuesta });

  }
  function guardarPreguntaBot() {
    if (!preguntaForm.pregunta || !preguntaForm.respuesta) return;
    const id = editandoPreguntaId || db.ref('chatbot/preguntas').push().key;
    db.ref('chatbot/preguntas/' + id).set({ pregunta: preguntaForm.pregunta, respuesta: preguntaForm.respuesta });
    resetPreguntaBotForm();
  }
  function eliminarPreguntaBot(id) {
    if (confirm('¿Eliminar esta pregunta del chatbot?')) db.ref('chatbot/preguntas/' + id).remove();
  }
  function abrirChat() {
    setPreguntaActiva(null);
    setMostrarChat(true);
  }

  function guardarConfig() {
    db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput });
  }
  function handleLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => {
      db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput, logo: dataUrl });
    }, 300);
  }
  function handleQrPago(e) {
    const file = e.target.files[0];
    if (!file) return;
    resizeImagen(file, dataUrl => {
      db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput, qrPago: dataUrl });

  function quitarQrPago() {
    if (confirm('¿Quitar el QR de pago?')) db.ref('config').set({ ...config, whatsapp: whatsappInput, instagram: instagramInput, direccion: direccionInput, alias: aliasInput, qrPago: '' });
  }

  // ===================== VISTA COCINA (pantalla completa, sin login) =====================
  if (modoVistaCocina) {
    const pedidosCocina = listaPedidos
      .filter(p => p.estado === 'recibido' || p.estado === 'en_preparacion' || p.estado === 'en_camino')

          <span className="bg-bronce-500 text-cafe-900 text-xs font-bold px-3 py-1.5 rounded-full">{pedidosCocina.length} pendiente{pedidosCocina.length === 1 ? '' : 's'}</span>
        </div>

        {pedidosCocina.length === 0 && (

          </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {pedidosCocina.map(p => {

            <div className="leading-none">

                              {listaInsumos.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
                            </select>
                            <input value={cantInsumoProd} onChange={e => setCantInsumoProd(e.target.value)} type="number" placeholder="Cant." className="w-16 border border-cafe-200 rounded-lg p-2 text-xs bg-cafe-100 text-cafe-900" />
                            <button onClick={agregarInsumoAProducto} className="bg-bronce-500 text-cafe-900 px-3 rounded-lg text-xs font-bold">+</button>
                          </div>
                        )}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={guardarProducto} className="flex-1 bg-bronce-500 text-cafe-900 py-2 rounded-xl text-xs font-bold">{editandoId ? 'Guardar cambios' : 'Agregar al menú'}</button>
                        {editandoId && <button onClick={resetForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    {listaProductos.length === 0 && (
                      <button onClick={cargarMenuInicial} className="w-full bg-vino-600 text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                        <i className="fa-solid fa-burger"></i>Cargar menú de ejemplo (Smash & Co.)
                      </button>
                    )}

                    <div className="space-y-1.5">
                      {listaProductos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste ítems.</p>}
                      {listaProductos.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-cafe-100 p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{p.imagen && <img src={p.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.nombre}</p>
                            <p className="text-cafe-400">{p.categoria} · ${p.precio}</p>
                          </div>
                          <button onClick={() => editarProducto(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarProducto(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'combos' && (
                  <div className="space-y-4">
                    <p className="text-xs text-cafe-500">Los combos y promos aparecen destacados arriba del menú, con su propio precio fijo, y se piden igual que cualquier ítem.</p>
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-cafe-100">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoComboId ? 'Editar combo/promo' : 'Nuevo combo/promo'}</h4>
                      <input value={comboForm.nombre} onChange={e => setComboForm({...comboForm, nombre: e.target.value})} placeholder="Ej: Combo Doble + Papas + Gaseosa" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      <textarea value={comboForm.descripcion} onChange={e => setComboForm({...comboForm, descripcion: e.target.value})} placeholder="Descripción breve" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900"></textarea>
                      <input value={comboForm.precio} onChange={e => setComboForm({...comboForm, precio: e.target.value})} type="number" placeholder="Precio del combo" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      <div className="flex items-center gap-3">
                        <label className="flex-shrink-0 bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          <i className="fa-solid fa-camera mr-1.5"></i>Foto
                          <input type="file" accept="image/*" onChange={handleImagenCombo} className="hidden" />
                        </label>
                        {comboForm.imagen && <img src={comboForm.imagen} className="w-12 h-12 rounded-lg object-cover" />}
                      </div>

                      <div className="border-t border-cafe-100 pt-2">
                        <p className="text-xs font-bold text-cafe-500 mb-1.5">Insumos que consume (para descontar stock)</p>
                        {(comboForm.insumos || []).length > 0 && (
                          <div className="space-y-1 mb-2">
                            {comboForm.insumos.map((ins, idx) => (
                              <div key={idx} className="flex items-center justify-between bg-cafe-50 rounded-lg px-2 py-1 text-xs">
                                <span>{insumos[ins.insumoId]?.nombre || '(insumo eliminado)'} — {ins.cantidad} {insumos[ins.insumoId]?.unidad || ''}</span>
                                <button onClick={() => quitarInsumoDeCombo(idx)} className="text-vino-600"><i className="fa-solid fa-xmark"></i></button>
                              </div>
                            ))}
                          </div>
                        )}
                        {listaInsumos.length === 0 ? (
                          <p className="text-[11px] text-cafe-400">Cargá insumos primero en la pestaña "Stock".</p>
                        ) : (
                          <div className="flex gap-1.5">
                            <select value={selInsumoCombo} onChange={e => setSelInsumoCombo(e.target.value)} className="flex-1 border border-cafe-200 rounded-lg p-2 text-xs bg-cafe-100 text-cafe-900">
                              <option value="">Insumo...</option>
                              {listaInsumos.map(i => <option key={i.id} value={i.id}>{i.nombre}</option>)}
                            </select>
                            <input value={cantInsumoCombo} onChange={e => setCantInsumoCombo(e.target.value)} type="number" placeholder="Cant." className="w-16 border border-cafe-200 rounded-lg p-2 text-xs bg-cafe-100 text-cafe-900" />
                            <button onClick={agregarInsumoACombo} className="bg-bronce-500 text-cafe-900 px-3 rounded-lg text-xs font-bold">+</button>
                          </div>
                        )}
                      </div>

                      <div className="flex gap-2">
                        <button onClick={guardarCombo} className="flex-1 bg-vino-600 text-white py-2 rounded-xl text-xs font-bold">{editandoComboId ? 'Guardar cambios' : 'Agregar combo/promo'}</button>
                        {editandoComboId && <button onClick={resetComboForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaCombos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste combos ni promos.</p>}
                      {listaCombos.map(c => (
                        <div key={c.id} className="flex items-center gap-2.5 border border-cafe-100 bg-cafe-100 p-2 rounded-xl text-xs">
                          <div className="w-9 h-9 rounded-lg bg-cafe-100 flex-shrink-0 overflow-hidden">{c.imagen && <img src={c.imagen} className="w-full h-full object-cover" />}</div>
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{c.nombre}</p>
                            <p className="text-cafe-400">${c.precio}</p>
                          </div>
                          <button onClick={() => editarCombo(c)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarCombo(c.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'stock' && (
                  <div className="space-y-4">
                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-cafe-100">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoInsumoId ? 'Editar insumo' : 'Nuevo insumo'}</h4>
                      <input value={insumoForm.nombre} onChange={e => setInsumoForm({...insumoForm, nombre: e.target.value})} placeholder="Ej: Carne picada, Pan, Coca cola 1.5L" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      <div className="flex gap-2">
                        <input value={insumoForm.unidad} onChange={e => setInsumoForm({...insumoForm, unidad: e.target.value})} placeholder="Unidad (kg, l, unidad...)" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                        <input value={insumoForm.cantidad} onChange={e => setInsumoForm({...insumoForm, cantidad: e.target.value})} type="number" placeholder="Stock actual" className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      </div>
                      <input value={insumoForm.minimo} onChange={e => setInsumoForm({...insumoForm, minimo: e.target.value})} type="number" placeholder="Aviso de stock bajo cuando llegue a..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      <div className="flex gap-2">
                        <button onClick={guardarInsumo} className="flex-1 bg-bronce-500 text-cafe-900 py-2 rounded-xl text-xs font-bold">{editandoInsumoId ? 'Guardar cambios' : 'Agregar insumo'}</button>
                        {editandoInsumoId && <button onClick={resetInsumoForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaInsumos.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste insumos.</p>}
                      {listaInsumos.map(i => {
                        const bajoStock = i.minimo > 0 && Number(i.cantidad) <= Number(i.minimo);
                        return (
                          <div key={i.id} className={`flex items-center gap-2.5 border p-2.5 rounded-xl text-xs ${bajoStock ? 'border-vino-300 bg-vino-500/5' : 'border-cafe-100 bg-cafe-100'}`}>
                            <div className="flex-1 min-w-0">
                              <p className="font-bold text-cafe-800 truncate">{i.nombre}</p>
                              <p className={bajoStock ? 'text-vino-600 font-bold' : 'text-cafe-400'}>
                                {i.cantidad} {i.unidad} en stock{bajoStock && ' · ¡bajo stock!'}
                              </p>
                            </div>
                            <button onClick={() => editarInsumo(i)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => eliminarInsumo(i.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {adminTab === 'categorias' && (
                  <div className="space-y-4">
                    <div className="flex gap-2">
                      <input value={nuevaCategoria} onChange={e => setNuevaCategoria(e.target.value)} placeholder="Ej: Clásicas, Cheese, Brothers, Bebidas..." className="flex-1 border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" onKeyDown={e => e.key==='Enter' && agregarCategoria()} />
                      <button onClick={agregarCategoria} className="bg-bronce-500 text-cafe-900 px-4 rounded-xl text-sm font-bold">Agregar</button>
                    </div>
                    <div className="space-y-1.5">
                      {categorias.length === 0 && <p className="text-cafe-400 text-xs">Todavía no cargaste categorías.</p>}
                      {categorias.map(c => (
                        <div key={c} className="flex justify-between items-center border border-cafe-100 bg-cafe-100 p-2.5 rounded-xl text-sm">
                          <span className="text-cafe-800 font-medium">{c}</span>
                          <button onClick={() => eliminarCategoria(c)} className="text-vino-600"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'chatbot' && (
                  <div className="space-y-4">
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Saludo inicial</label>
                      <textarea value={chatSaludoInput} onChange={e => setChatSaludoInput(e.target.value)} placeholder={SALUDO_BOT_DEFAULT} rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900"></textarea>
                      <button onClick={guardarSaludoBot} className="mt-1.5 bg-bronce-500 text-cafe-900 px-4 py-1.5 rounded-xl text-xs font-bold">Guardar saludo</button>
                    </div>

                    <div className="border border-cafe-200 rounded-xl p-3 space-y-2 bg-cafe-100">
                      <h4 className="font-bold text-xs uppercase tracking-wider text-cafe-400">{editandoPreguntaId ? 'Editar pregunta' : 'Nueva pregunta'}</h4>
                      <input value={preguntaForm.pregunta} onChange={e => setPreguntaForm({...preguntaForm, pregunta: e.target.value})} placeholder="Ej: ¿Hacen delivery?" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                      <textarea value={preguntaForm.respuesta} onChange={e => setPreguntaForm({...preguntaForm, respuesta: e.target.value})} placeholder="Respuesta" rows="2" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900"></textarea>
                      <div className="flex gap-2">
                        <button onClick={guardarPreguntaBot} className="flex-1 bg-bronce-500 text-cafe-900 py-2 rounded-xl text-xs font-bold">{editandoPreguntaId ? 'Guardar cambios' : 'Agregar pregunta'}</button>
                        {editandoPreguntaId && <button onClick={resetPreguntaBotForm} className="px-4 bg-cafe-100 rounded-xl text-xs font-bold">Cancelar</button>}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      {listaPreguntasBot.length === 0 && <p className="text-cafe-400 text-xs text-center py-4">Todavía no cargaste preguntas.</p>}
                      {listaPreguntasBot.map(p => (
                        <div key={p.id} className="flex items-center gap-2.5 border border-cafe-100 bg-cafe-100 p-2 rounded-xl text-xs">
                          <div className="flex-1 min-w-0">
                            <p className="font-bold text-cafe-800 truncate">{p.pregunta}</p>
                            <p className="text-cafe-400 truncate">{p.respuesta}</p>
                          </div>
                          <button onClick={() => editarPreguntaBot(p)} className="text-cafe-500 px-1.5"><i className="fa-solid fa-pen"></i></button>
                          <button onClick={() => eliminarPreguntaBot(p.id)} className="text-vino-600 px-1.5"><i className="fa-solid fa-trash-can"></i></button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {adminTab === 'config' && (
                  <div className="space-y-3">
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Logo</label>
                      <div className="flex items-center gap-3">
                        {config.logo && <img src={config.logo} className="w-12 h-12 rounded-full object-cover" />}
                        <label className="bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          Subir logo<input type="file" accept="image/*" onChange={handleLogo} className="hidden" />
                        </label>
                      </div>
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">WhatsApp (solo números, con código de país)</label>
                      <input value={whatsappInput} onChange={e => setWhatsappInput(e.target.value)} placeholder="5491122334455" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Instagram (usuario, sin @)</label>
                      <input value={instagramInput} onChange={e => setInstagramInput(e.target.value)} placeholder="thepapasbrothers" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Dirección</label>
                      <input value={direccionInput} onChange={e => setDireccionInput(e.target.value)} placeholder="Calle 48 2085, ..." className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900" />
                    </div>
                    <div className="border-t border-cafe-100 pt-3">
                      <p className="text-xs font-bold text-cafe-700 mb-2">Medios de pago</p>
                      <label className="text-xs font-bold text-cafe-600 block mb-1">Alias para transferencia</label>
                      <input value={aliasInput} onChange={e => setAliasInput(e.target.value)} placeholder="papas.brothers.mp" className="w-full border border-cafe-200 rounded-xl p-2.5 text-sm bg-cafe-100 text-cafe-900 mb-3" />
                      <label className="text-xs font-bold text-cafe-600 block mb-1">QR de pago (Mercado Pago, billetera, etc.)</label>
                      <div className="flex items-center gap-3">
                        {config.qrPago && <img src={config.qrPago} className="w-16 h-16 rounded-lg object-cover border border-cafe-200" />}
                        <label className="bg-cafe-100 text-cafe-700 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer">
                          Subir QR<input type="file" accept="image/*" onChange={handleQrPago} className="hidden" />
                        </label>
                        {config.qrPago && <button onClick={quitarQrPago} className="text-vino-600 text-xs font-bold">Quitar</button>}
                      </div>
                    </div>
                    <button onClick={guardarConfig} className="w-full bg-bronce-500 text-cafe-900 py-2.5 rounded-xl text-sm font-bold">Guardar configuración</button>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
